[project]
name = "edscrape"
version = "0.1.0"
description = "Keyboard-driven terminal app that surfaces Ed Discussion teaching-team messages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "playwright",
    "textual>=8.2,<9",
    "rich",
    "typer",
    "tomli-w",
]

[project.scripts]
edscrape = "edscrape.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edscrape"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
